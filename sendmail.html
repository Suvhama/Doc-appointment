<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact Support</title>
    <style rel="stylesheet" href="sendmail.css"></style>
   
</head>

<body>
    <div class="contact-form">
        <h2>Contact Support</h2>
        <form action="../sendmail.php" method="post">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>

            <label for="email">Recipient Email</label>
            <input type="email" id="email" name="email" placeholder="Enter recipient email" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="4" placeholder="Write your message here..." required></textarea>

            <input type="submit" value="Send Message">
        </form>
        <a href="http://127.0.0.1:5501/html/users/userDashboard.html" class="back-button">Back to Dashboard</a>
    </div>
</body>

</html>
