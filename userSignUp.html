<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - MediSync</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer"
    />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #F9FBFF;
            color: #333;
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        a {
            text-decoration: none;
            color: #4A90E2;
            transition: color 0.3s ease, transform 0.3s ease;
        }
        
        a:hover {
            color: #357ABD;
        }
        
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(249, 251, 255, 0.9), rgba(230, 240, 250, 0.9));
            z-index: -1;
            animation: backgroundPulse 4s ease-in-out infinite;
        }
        
        @keyframes backgroundPulse {
            0%,
            100% {
                opacity: 0.8;
            }
            50% {
                opacity: 1;
            }
        }
        
        .register-section {
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
            perspective: 1000px;
        }
        
        .register-info {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 1s ease-out forwards;
        }
        
        .register-info h1 {
            color: #1E5AA3;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        
        .register-info p {
            color: #555;
            font-size: 1.2rem;
            max-width: 600px;
            line-height: 1.5;
        }
        
        .create-account {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            box-sizing: border-box;
            transform: translateZ(0);
            animation: cardRise 1.2s ease-out forwards;
        }
        
        .create-account h2 {
            color: #1E5AA3;
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 30px;
            letter-spacing: 1px;
            animation: fadeInDown 0.8s ease-out forwards;
        }
        
        .double-input {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .form-group {
            margin-bottom: 25px;
            text-align: left;
            width: 100%;
            box-sizing: border-box;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #555;
            font-weight: 600;
            font-size: 1rem;
        }
        
        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .form-group input[type="text"],
        .input-group input[type="email"],
        .input-group input[type="tel"],
        .input-group input[type="password"] {
            width: 100%;
            padding: 14px 45px 14px 15px;
            border: 2px solid #E6F0FA;
            border-radius: 8px;
            font-size: 1rem;
            color: #333;
            background-color: #F9FBFF;
            transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
            box-sizing: border-box;
        }
        
        .form-group input[type="text"]:focus,
        .input-group input[type="email"]:focus,
        .input-group input[type="tel"]:focus,
        .input-group input[type="password"]:focus {
            outline: none;
            border-color: #4A90E2;
            box-shadow: 0 0 8px rgba(74, 144, 226, 0.3);
            transform: scale(1.02);
        }
        
        .input-group i {
            position: absolute;
            right: 15px;
            color: #357ABD;
            font-size: 1.2rem;
            transition: color 0.3s ease, transform 0.3s ease;
        }
        
        .input-group input:focus+i {
            color: #4A90E2;
            transform: scale(1.1);
        }
        
        .signup-button {
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            color: #ffffff;
            padding: 15px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 5px 15px rgba(74, 144, 226, 0.3);
        }
        
        .signup-button:hover {
            background: linear-gradient(135deg, #357ABD 0%, #1E5AA3 100%);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(74, 144, 226, 0.5);
        }
        
        .login-prompt {
            margin-top: 30px;
            text-align: center;
            color: #555;
        }
        
        .login-prompt p {
            margin-bottom: 10px;
            font-size: 1rem;
        }
        
        .login-button {
            display: inline-block;
            background: transparent;
            color: #4A90E2;
            border: 2px solid #4A90E2;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .login-button:hover {
            background: #E6F0FA;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(74, 144, 226, 0.3);
        }
        
        @keyframes cardRise {
            0% {
                opacity: 0;
                transform: translateY(100px) scale(0.95);
            }
            60% {
                opacity: 1;
                transform: translateY(-10px) scale(1.02);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        @keyframes fadeInDown {
            0% {
                opacity: 0;
                transform: translateY(-30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes inputPop {
            0% {
                opacity: 0;
                transform: scale( maltr0.9);
            }
            70% {
                opacity: 1;
                transform: scale(1.05);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .form-group {
            animation: inputPop 0.8s ease-out forwards;
            animation-delay: calc(0.2s * var(--input-index));
        }
        
        @media (max-width: 768px) {
            .register-section {
                padding: 20px;
            }
            .double-input {
                flex-direction: column;
                gap: 0;
            }
            .create-account {
                padding: 25px;
                max-width: 100%;
            }
            .register-info h1 {
                font-size: 2rem;
            }
            .register-info p {
                font-size: 1rem;
            }
        }
        
        .alert {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px;
            border-radius: 8px;
            z-index: 1000;
            text-align: center;
            display: none;
        }
        
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>

<body>
    <div class="container">
        <section class="register-section">
            <div class="register-info">
                <h1>Register</h1>
                <p>Please fill the form with correct information to Get Started.</p>
            </div>
            <div class="create-account">
                <h2>Create an Account</h2>
                <form id="registerForm">
                    <div class="double-input">
                        <div class="form-group" style="--input-index: 0;">
                            <label for="firstName">First Name</label>
                            <input type="text" id="firstName" name="firstName" placeholder="First Name" required>
                        </div>
                        <div class="form-group" style="--input-index: 1;">
                            <label for="lastName">Last Name</label>
                            <input type="text" id="lastName" name="lastName" placeholder="Last Name" required>
                        </div>
                    </div>

                    <div class="form-group" style="--input-index: 2;">
                        <label for="email">Email Address</label>
                        <div class="input-group">
                            <input type="email" id="email" name="email" placeholder="Email Address" required>
                            <i class="fas fa-envelope"></i>
                        </div>
                    </div>

                    <div class="form-group" style="--input-index: 3;">
                        <label for="phone">Phone Number</label>
                        <div class="input-group">
                            <input type="tel" id="phone" name="phone" placeholder="Phone Number" pattern="[0-9]{10}" required>
                            <i class="fas fa-phone"></i>
                        </div>
                    </div>

                    <div class="form-group" style="--input-index: 4;">
                        <label for="password">Password</label>
                        <div class="input-group">
                            <input type="password" id="password" name="password" placeholder="Password" required>
                            <i class="fas fa-lock"></i>
                        </div>
                    </div>
                    <button type="submit" class="signup-button">Sign Up</button>
                </form>
                <div class="login-prompt">
                    <p>Already have an account?</p>
                    <a href="userLogin.html" class="login-button">Log In</a>
                </div>
            </div>
        </section>
    </div>

    <div id="alertBox" class="alert"></div>

    <script>
        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type}`;
            alertBox.style.display = 'block';
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 3000);
        }

        document.getElementById('registerForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const formData = new FormData(this);

            fetch('http://localhost/MediSync/backend/signUpUser.php', {
                    method: 'POST',
                    body: formData,
                    mode: 'cors'
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.success) {
                        showAlert(data.message, 'success');
                        document.getElementById('registerForm').reset();
                        setTimeout(() => {
                            window.location.href = 'userLogin.html';
                        }, 3000);
                    } else {
                        showAlert(data.message, 'danger');
                    }
                })
                .catch(error => {
                    console.error('Fetch error:', error);
                    showAlert('An error occurred. Please try again. Check console for details.', 'danger');
                });
        });
    </script>
</body>

</html>
