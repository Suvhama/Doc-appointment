<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - MediSync</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer"
    />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #F9FBFF;
            /* Light blue-gray from main page */
            color: #333;
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        a {
            text-decoration: none;
            color: #4A90E2;
            /* Primary blue */
            transition: color 0.3s ease, transform 0.3s ease;
        }
        
        a:hover {
            color: #357ABD;
            /* Secondary blue */
        }
        /* Background Overlay */
        
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(249, 251, 255, 0.9), rgba(230, 240, 250, 0.9));
            /* Subtle gradient overlay */
            z-index: -1;
            animation: backgroundFade 2s ease-in-out forwards;
        }
        
        @keyframes backgroundFade {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        /* Login-Specific Styles */
        
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            perspective: 1000px;
            /* For 3D effects */
        }
        
        .login-methods,
        .user-login-form {
            background-color: rgba(255, 255, 255, 0.95);
            /* Slightly opaque white */
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 400px;
            margin: 20px;
            text-align: center;
            transform: translateZ(0);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        
        .login-methods {
            animation: cardSlideIn 1s ease-out forwards;
        }
        
        .user-login-form {
            animation: cardSlideIn 1s ease-out forwards 0.2s;
        }
        
        .login-methods:hover,
        .user-login-form:hover {
            transform: translateY(-10px);
        }
        
        .login-methods h2,
        .user-login-form h2 {
            color: #1E5AA3;
            /* Dark accent blue */
            margin-bottom: 25px;
            font-weight: 600;
            font-size: 2rem;
            letter-spacing: 1px;
            animation: fadeInDown 0.8s ease-out forwards;
        }
        
        .login-methods p {
            color: #555;
            margin-bottom: 35px;
            font-size: 1.1rem;
            line-height: 1.5;
        }
        
        .method-options {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            gap: 20px;
        }
        
        .method-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px solid #E6F0FA;
            /* Light blue border */
            background-color: #ffffff;
            color: #555;
            font-size: 2.5rem;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            animation: bounceIn 0.8s ease-out forwards;
            animation-delay: calc(0.2s * var(--method-index));
        }
        
        .method-card i {
            margin-bottom: 12px;
            transition: transform 0.3s ease, color 0.3s ease;
        }
        
        .method-card span {
            font-size: 1rem;
            font-weight: 500;
        }
        
        .method-card:hover {
            border-color: #4A90E2;
            /* Primary blue */
            color: #4A90E2;
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 15px 25px rgba(74, 144, 226, 0.3);
        }
        
        .method-card.selected {
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            color: #ffffff;
            border-color: #4A90E2;
        }
        
        .method-card.selected:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 25px rgba(74, 144, 226, 0.5);
        }
        
        .method-card.doctor-login {
            background-color: #ffffff;
            color: #555;
            border-color: #E6F0FA;
        }
        
        .method-card.doctor-login:hover {
            border-color: #4A90E2;
            color: #4A90E2;
            transform: scale(1.1) rotate(5deg);
        }
        /* Form Styling */
        
        .user-login-form form {
            display: flex;
            flex-direction: column;
        }
        
        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 10px;
            color: #555;
            font-weight: 600;
            font-size: 1rem;
        }
        
        .input-field {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .input-field input[type="email"],
        .input-field input[type="password"] {
            width: 100%;
            padding: 14px 45px 14px 15px;
            border: 2px solid #E6F0FA;
            /* Light blue border */
            border-radius: 8px;
            font-size: 1rem;
            color: #333;
            background-color: #F9FBFF;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        
        .input-field input[type="email"]:focus,
        .input-field input[type="password"]:focus {
            outline: none;
            border-color: #4A90E2;
            /* Primary blue */
            box-shadow: 0 0 8px rgba(74, 144, 226, 0.3);
        }
        
        .input-field i {
            position: absolute;
            right: 15px;
            color: #357ABD;
            /* Secondary blue */
            font-size: 1.2rem;
            transition: color 0.3s ease;
        }
        
        .input-field input:focus+i {
            color: #4A90E2;
            /* Primary blue on focus */
        }
        
        .login-button {
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            color: #ffffff;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 5px 15px rgba(74, 144, 226, 0.3);
        }
        
        .login-button:hover {
            background: linear-gradient(135deg, #357ABD 0%, #1E5AA3 100%);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(74, 144, 226, 0.5);
        }
        
        .register-section {
            margin-top: 35px;
            color: #555;
        }
        
        .register-section p {
            margin-bottom: 10px;
            font-size: 1rem;
        }
        
        .sign-up-button {
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .sign-up-button:hover {
            transform: scale(1.05);
        }
        /* Animations */
        
        @keyframes cardSlideIn {
            0% {
                opacity: 0;
                transform: translateY(50px) rotateX(-10deg);
            }
            100% {
                opacity: 1;
                transform: translateY(0) rotateX(0deg);
            }
        }
        
        @keyframes fadeInDown {
            0% {
                opacity: 0;
                transform: translateY(-20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            60% {
                opacity: 1;
                transform: scale(1.1);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        /* Responsive Adjustments */
        
        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
                align-items: stretch;
            }
            .login-methods,
            .user-login-form {
                width: 100%;
                margin: 15px 0;
                padding: 25px;
            }
            .method-options {
                gap: 15px;
            }
            .method-card {
                width: 100px;
                height: 100px;
                font-size: 2rem;
            }
        }
        /* alert styling section */
        
        .alert {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px;
            border-radius: 8px;
            z-index: 1000;
            text-align: center;
            display: none;
        }
        
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-methods">
            <h2>Log In</h2>
            <p>Select your Log In method</p>
            <div class="method-options">
                <a href="#" class="method-card user-login selected" style="--method-index: 0;">
                    <i class="fas fa-user"></i>
                    <span>User</span>
                </a>
                <a href="/html/doctors/doctorLogin.html" class="method-card doctor-login" style="--method-index: 1;">
                    <i class="fas fa-user-md"></i>
                    <span>Doctor</span>
                </a>
            </div>
        </div>

        <div class="user-login-form">
            <h2>User Log In</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <div class="input-field">
                        <input type="email" id="email" name="email" placeholder="Email Address" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-field">
                        <input type="password" id="password" name="password" placeholder="Password" required>
                        <i class="fas fa-lock"></i>
                    </div>
                </div>

                <button type="submit" class="login-button">Log In</button>
            </form>

            <div class="register-section">
                <p>Register as a User?</p>
                <a href="userSignUp.html" class="sign-up-button">Sign Up</a>
            </div>
        </div>
    </div>

    <div id="alertBox" class="alert"></div>

    <script>
        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type}`;
            alertBox.style.display = 'block';
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 3000);
        }

        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const data = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            fetch('http://localhost/MediSync/backend/loginUser.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data),
                    mode: 'cors'
                })
                .then(response => {
                    if (!response.ok) {
                        // Improved error handling for HTTP errors
                        return response.json().then(err => { //Parse the JSON from the response
                            throw new Error(err.message || `HTTP error! Status: ${response.status}`); //Now throws the message from PHP or a default one
                        });

                    }
                    return response.json();
                })
                .then(data => {
                    if (data.success) {
                        localStorage.setItem("email", document.getElementById('email').value);
                        showAlert(data.message, 'success');
                        setTimeout(() => {
                            window.location.href = 'userDashboard.html';
                        }, 2000);
                    } else {
                        showAlert(data.message, 'danger'); // Display the specific message
                    }
                })
                .catch(error => {
                    // More specific error handling
                    console.error('Login error:', error);
                    showAlert(error.message || 'An error occurred. Please try again.', 'danger'); //Displays the message OR a default one

                });
        });
    </script>
</body>

</html>
